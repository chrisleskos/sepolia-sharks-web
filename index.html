    <link
      rel="stylesheet"
      type="text/css"

    />
    <link

    />

    <link
      rel="stylesheet"

      href="styling/mobile/navbar-mobile.css"
    />
    <link
      rel="stylesheet"
      type="text/css"
      media="screen and (min-width: 730px)"
      href="styling/navbar.css"
    />

    <link
      rel="stylesheet"

    />
    <link

      href="styling/home.css"
    />

    <link rel="stylesheet" type="text/css" href="styling/mobile/footer.css" />

    <!-- FONTS -->
    <link
      href="https://fonts.googleapis.com/css2?family=Epunda+Sans:ital,wght@0,300..900;1,300..900&family=Ephesis&family=Tektur:wght@400..900&family=Oxanium:wght@200..800&family=Bowlby+One+SC&family=Teko:wght@300..700&display=swap"
      rel="stylesheet"
    />

    <script
      src="https://unpkg.com/smoothscroll-polyfill/dist/smoothscroll.min.js"
      crossorigin="anonymous"
      defer
    ></script>
  </head>
  <body>
    <nav>
      <div class="nav-menu-btn">&equiv;</div>
      <a href="/" class="nav-logo nav-sharks-logo">
        <img src="img/sharks/shark3.webp" alt="sharks logo" />
      </a>
      <!-- <div class="nav-x-sign">&times;</div> -->
      <div class="nav-vertical-line"></div>
      <a
        href="https://www.basketaki.com/teams/sepolia-sharks/profile"
        class="nav-logo nav-league-logo"
      >
        <img src="img/sponsors/basketaki.png" alt="basketaki logo" />
      </a>
      <div class="nav-menu-wrap">
        <div class="nav-close-menu-btn">&times;</div>
        <div class="nav-options">
          <a href="index.html" class="selected">Home</a>
          <a href="squad.html">Squad</a>
          <a href="stats.html">Stats</a>
        </div>
        <div class="nav-social">
          <a href="https://www.instagram.com/sepolia.sharks/">
            <img src="img/contact/insta.png" alt="instagram page" />
          </a>
          <a href="https://www.tiktok.com/@sepolia.sharks">
            <img src="img/contact/tiktok.png" alt="tiktok page" />
          </a>
        </div>
        <div class="nav-sponsors">
          <a
            href="https://www.sayprint.gr/main-home/"
            class="nav-logo nav-sayprint-logo"
          >
            <img src="img/sponsors/sayprintlogo.png" alt="sayprint logo" />
          </a>
          <a
            href="https://www.instagram.com/nebo.tinos/"
            class="nav-logo nav-nebo-logo"
          >
            <img src="img/sponsors/nebo_black.png" alt="nebo logo" />
          </a>
          <a
            href="https://minivantaxi.gr/el/"
            class="nav-logo nav-minivan-logo"
          >
            <img
              src="img/sponsors/MiniVanTaxi LOGO.jpg"
              alt="minivan taxi logo"
            />
          </a>
          <a href="https://antetokounbros.com/en/" class="nav-logo nav-ab-logo">
            <img src="img/sponsors/ab.png" alt="antetokounbros logo" />
          </a>
        </div>
      </div>
    </nav>
    <header>
      <div class="background">
        <img src="img/header/h1.webp" id="header-img" alt="header image" />
      </div>
    </header>
    <main>
      <div
        class="matches-container swiffy-slider slider-nav-noloop"
        id="match-slider"
      >
        <ul class="slider-container" id="matches-slider-container">
          <li>
            <div class="next-match-wrap match">
              <div class="next-match-main">
                <div class="next-match-header">
                  <div class="next-match-competition"></div>
                </div>
                <div class="next-match-teams">
                  <div class="sepolia-sharks-team">
                    <img src="img/sharks/logo.webp" alt="sharks game logo" />
                    <div class="team-name">Sepolia Sharks</div>
                  </div>
                  <div class="next-match-opposing-team">
                    <img alt="opponent logo" />
                    <div class="team-name"></div>
                  </div>
                </div>
                <div class="next-match-countdown">
                  <div>
                    <div class="counter" id="days-counter">00</div>
                    <div class="countdown-label">DAYS</div>
                  </div>
                  <div class="colons">:</div>
                  <div>
                    <div class="counter" id="hours-counter">00</div>
                    <div class="countdown-label">HRS</div>
                  </div>
                  <div class="colons">:</div>
                  <div>
                    <div class="counter" id="minutes-counter">00</div>
                    <div class="countdown-label">MINS</div>
                  </div>
                  <div class="colons">:</div>
                  <div>
                    <div class="counter" id="seconds-counter">00</div>
                    <div class="countdown-label">SECS</div>
                  </div>
                </div>
              </div>

              <div class="next-match-footer">
                <div class="next-match-date">-</div>
                <div
                  class="see-full-next-match-btn"
                  id="see-full-next-match-btn"
                  onclick="openFullNextMatch()"
                >
                  Full view
                </div>
              </div>
            </div>
          </li>
        </ul>
        <button type="button" class="slider-nav"></button>
        <button type="button" class="slider-nav slider-nav-next"></button>

        <!-- optional bullets -->
        <div class="slider-indicators" id="matches-slider-indicators">
          <button class="active next-match"></button>
        </div>
      </div>

      <div class="full-next-match-container" id="full-next-match-container">
        <span class="close-full-view" onclick="closeFullNextMatch()"
          >&times;</span
        >
        <button id="download-full-view-btn">&#x21e9;</button>
        <div class="full-next-match-wrap" id="full-next-match">
          <div class="full-next-match-title">
            NEXT<br />
            <div>
              <span>M</span><span>A</span> <span>T</span><span>C</span
              ><span>H</span>
            </div>
          </div>
          <div class="full-next-match-details-wrap">
            <div class="full-next-match-round"></div>
            <div class="full-next-match-competition"></div>
            <div class="full-next-match-teams">
              <div class="full-next-match-team">
                <img src="img/sharks/logo.webp" alt="sharks game logo" />
                <div class="full-next-match-team-name">Sepolia Sharks</div>
              </div>
              <div class="full-next-match-team">
                <img
                  alt="Opposing team logo"
                  id="full-view-opposing-team-img"
                />
                <div
                  class="full-next-match-team-name"
                  id="full-view-opposing-team-name"
                ></div>
              </div>
            </div>
            <div class="full-next-match-date"></div>
            <button class="full-next-match-place"></button>
          </div>
          <div class="full-next-match-sponsors">
            <img
              src="img/sponsors/nebo_green.png"
              class="full-next-match-nebo"
              alt="nebo full match logo"
            />
            <img
              src="img/sponsors/sayprintlogo.png"
              alt="sayprint full match logo"
            />
            <img
              src="img/sponsors/MiniVanTaxi LOGO.jpg"
              alt="minivan full match logo"
            />
          </div>
        </div>
      </div>
    </main>
    <footer>
      <div class="sharkattack">shark attack</div>
      <div class="contact">
        <a class="email" href="mailto: sepolia.sharks19@gmail.com">
          <img src="img/contact/mail.webp" alt="gmail logo" /><span
            >sepolia.sharks19@gmail.com</span
          >
        </a>
      </div>
    </footer>
    <script src="js/base.js"></script>
    <!-- Swiffy JS -->
    <script
      src="https://cdn.jsdelivr.net/npm/swiffy-slider@1.6.0/dist/js/swiffy-slider.min.js"
      defer
    ></script>
    <script src="js/assets/team-logos.js"></script>
    <script src="js/home.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script>
      document.getElementById("download-full-view-btn").onclick = function () {
        const element = document.getElementById("full-next-match");
        html2canvas(element, {
          scale: 4,
        }).then((canvas) => {
          const link = document.createElement("a");
          link.download = "element.png";
          link.href = canvas.toDataURL();
          link.click();
        });
      };
    </script>
  </body>
</html>
